name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_browser_runtime_acceptance:
        description: Run the isolated real-backend browser acceptance suite.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.policy.outputs.backend }}
      frontend: ${{ steps.policy.outputs.frontend }}
      tooling: ${{ steps.policy.outputs.tooling }}
      level: ${{ steps.policy.outputs.level }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths and risk
        id: policy
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RANGE_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
        run: bash scripts/dev/erp-ci-change-policy --range "$RANGE_MODE" "$BASE_SHA" "$HEAD_SHA"

  backend-quality:
    needs: classify-changes
    if: needs.classify-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: Backend quality (shard ${{ matrix.shard }}/4)

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hahitantsoa_titan_erp_ci
          POSTGRES_USER: hahitantsoa_titan_erp_ci
          POSTGRES_PASSWORD: hahitantsoa_titan_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hahitantsoa_titan_erp_ci -d hahitantsoa_titan_erp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: hahitantsoa_titan_erp_ci
      POSTGRES_USER: hahitantsoa_titan_erp_ci
      POSTGRES_PASSWORD: hahitantsoa_titan_erp_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend quality gate
        env:
          BACKEND_TEST_SHARD: ${{ matrix.shard }}
        run: bash scripts/ci/backend-test-shard "$BACKEND_TEST_SHARD" 4

  frontend-quality:
    name: Frontend quality
    needs: classify-changes
    if: needs.classify-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  tooling-quality:
    name: Tooling quality
    needs: classify-changes
    if: needs.classify-changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate CI policy tooling
        run: |
          bash scripts/dev/test-erp-ci-policy
          bash scripts/dev/test-erp-logged-run

  browser-runtime-acceptance:
    name: Browser runtime acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.run_browser_runtime_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hahitantsoa_titan_erp_ci
          POSTGRES_USER: hahitantsoa_titan_erp_ci
          POSTGRES_PASSWORD: hahitantsoa_titan_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hahitantsoa_titan_erp_ci -d hahitantsoa_titan_erp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: hahitantsoa_titan_erp_ci
      POSTGRES_USER: hahitantsoa_titan_erp_ci
      POSTGRES_PASSWORD: hahitantsoa_titan_erp_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECRET_KEY: ci-browser-runtime-non-secret-key
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SESSION_COOKIE_SECURE: "0"
      DJANGO_CSRF_COOKIE_SECURE: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm --prefix frontend ci
          npm --prefix frontend exec playwright -- install --with-deps chromium

      - name: Provision isolated acceptance data
        env:
          DJANGO_DEV_USERNAME: phase1b-e2e
          DJANGO_DEV_PASSWORD: Test-only-Phase1B!
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py seed_all_demo
          python backend/manage.py seed_dev_admin
          python backend/manage.py seed_dev_user

      - name: Run backend for browser acceptance
        run: |
          python backend/manage.py runserver 127.0.0.1:8000 > backend-runtime.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat backend-runtime.log
          exit 1

      - name: Run real-backend browser acceptance
        working-directory: frontend
        run: |
          # Each group is independent. Redis is ephemeral for this manual job;
          # clearing it between groups prevents its login rate-limit state from
          # leaking across unrelated browser scenarios.
          run_group() {
            python -c 'import socket; s=socket.create_connection(("localhost", 6379)); s.sendall(b"*1\\r\\n$8\\r\\nFLUSHALL\\r\\n"); r=s.recv(1024); s.close(); assert r.startswith(b"+OK"), r'
            npm exec playwright -- test "$@" --project='Desktop Chrome'
          }
          run_group e2e/auth-session.spec.ts
          run_group e2e/phase1f-real-backend.spec.ts
          run_group e2e/phase1f-real-roles.spec.ts
          run_group e2e/lifecycle-write-titan.spec.ts

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-acceptance-artifacts
          path: |
            reports/6g-r6b-browser-validation/
            backend-runtime.log
          if-no-files-found: ignore

  ci-policy-gate:
    name: CI policy gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - classify-changes
      - backend-quality
      - frontend-quality
      - tooling-quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify required checks completed
        env:
          CLASSIFIER_RESULT: ${{ needs.classify-changes.result }}
          BACKEND_REQUIRED: ${{ needs.classify-changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_REQUIRED: ${{ needs.classify-changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          TOOLING_REQUIRED: ${{ needs.classify-changes.outputs.tooling }}
          TOOLING_RESULT: ${{ needs.tooling-quality.result }}
        run: >-
          bash scripts/dev/erp-ci-policy-gate
          "$CLASSIFIER_RESULT"
          "$BACKEND_REQUIRED"
          "$BACKEND_RESULT"
          "$FRONTEND_REQUIRED"
          "$FRONTEND_RESULT"
          "$TOOLING_REQUIRED"
          "$TOOLING_RESULT"
