name: hahitantsoa_titan_erp_production

services:
  db:
    image: postgres:17.10-bookworm
    env_file: production.env
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7.4.9-alpine
    env_file: production.env
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - production_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [internal]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/client/Dockerfile.backend
    env_file: production.env
    command: ["python", "backend/manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  backend:
    build:
      context: ../..
      dockerfile: deploy/client/Dockerfile.backend
    env_file: production.env
    environment:
      DOCUMENT_PDF_GENERATOR_CLASS: apps.documents.pdf.WeasyPrintPDFGenerator
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - production_media_data:/app/backend/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=2); data = json.loads(response.read().decode()); raise SystemExit(0 if response.status == 200 and data.get('status') == 'ok' else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [internal]

  frontend:
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    env_file: production.env
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    restart: unless-stopped
    networks: [edge, internal]

volumes:
  production_postgres_data:
  production_redis_data:
  production_media_data:
  production_caddy_data:
  production_caddy_config:

networks:
  internal:
    internal: true
  edge:
